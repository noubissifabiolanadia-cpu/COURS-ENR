<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    
    <!-- Informations de la page -->
    <title>Suivi des cours - Énergie Renouvelable</title>
    <meta name="description" content="Plateforme de suivi des charges horaires du Département Énergie Renouvelable, Faculté des Sciences, Université de Bertoua.">
    
    <!-- Polices de caractères -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Bibliothèque SheetJS via CDN officiel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js"></script>

    <style>
        /* --- STYLE CSS (Design de la page) --- */
        :root {
            --primary-color: #0a6b38; /* Vert de l'énergie renouvelable */
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            font-weight: 300;
            font-size: 14px;
        }

        main {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .upload-section {
            text-align: center;
            padding: 20px;
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            background-color: #f9fdfa;
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            background-color: var(--primary-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
            transition: background 0.3s;
        }

        .upload-btn:hover {
            background-color: #08522a;
        }

        /* Style généré pour le tableau Excel */
        #resultats table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        #resultats th, #resultats td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        #resultats th {
            background-color: var(--primary-color);
            color: white;
        }

        #resultats tr:nth-child(even) {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <header>
        <h1>Suivi des cours - Énergie Renouvelable</h1>
        <p>Université de Bertoua, Faculté des Sciences</p>
    </header>

    <main>
        <!-- Section pour uploader le fichier Excel -->
        <div class="upload-section">
            <p>Veuillez importer votre fichier de suivi des charges horaires (.xlsx, .xls)</p>
            <label for="uploadExcel" class="upload-btn">Choisir un fichier Excel</label>
            <input type="file" id="uploadExcel" accept=".xlsx, .xls" />
            <p id="fileName" style="margin-top: 10px; font-weight: 600; color: #555;"></p>
        </div>

        <!-- Section où le tableau s'affichera -->
        <div id="resultats">
            <!-- Le tableau apparaîtra ici -->
        </div>
    </main>

    <script>
        /* --- SCRIPT JAVASCRIPT (Logique de l'application) --- */
        
        // On récupère les éléments HTML
        const inputFile = document.getElementById('uploadExcel');
        const fileNameDisplay = document.getElementById('fileName');
        const resultDiv = document.getElementById('resultats');

        // On écoute le changement (quand un fichier est sélectionné)
        inputFile.addEventListener('change', (event) => {
            const file = event.target.files[0];
            
            if (file) {
                // Afficher le nom du fichier sélectionné
                fileNameDisplay.textContent = "Fichier chargé : " + file.name;
                
                // Préparer la lecture du fichier
                const reader = new FileReader();
                
                reader.onload = (e) => {
                    const data = new Uint8Array(e.target.result);
                    
                    // Lire le fichier avec SheetJS
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Prendre la première feuille du classeur
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    // Convertir la feuille en HTML
                    const htmlTable = XLSX.utils.sheet_to_html(worksheet);
                    
                    // Insérer le tableau généré dans la page
                    resultDiv.innerHTML = "<h3>Contenu de la feuille : " + firstSheetName + "</h3>" + htmlTable;
                };
                
                // Lancer la lecture en tant que tableau d'octets (ArrayBuffer)
                reader.readAsArrayBuffer(file);
            }
        });
    </script>

</body>
</html>
